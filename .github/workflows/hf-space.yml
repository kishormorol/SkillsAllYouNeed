name: Sync Hugging Face Space

# Mirrors the published site to https://huggingface.co/spaces/kishormorol/SkillsAllYouNeed
# after each push to main (Pages serves main directly), so the Space never drifts from GitHub.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never let two uploads race for the same Space; don't cancel one mid-upload.
concurrency:
  group: hf-space
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Stage the site
        run: |
          mkdir _hf
          cp index.html SkillsAllYouNeed.html data.js scripts.js styles.css \
             skills.json manifest.json favicon.svg sitemap.xml _hf/

      # `secrets` is not available to a step-level `if`, so the token check
      # becomes an output. Without it a fork, or this repo before the secret is
      # set, would fail the run for a reason nobody can act on.
      - name: Check for a Hugging Face token
        id: token
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -n "$HF_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::HF_TOKEN is not set, so the Space was not updated."
          fi

      - uses: actions/setup-python@v5
        if: steps.token.outputs.present == 'true'
        with:
          python-version: '3.12'

      - name: Install the Hugging Face client
        if: steps.token.outputs.present == 'true'
        run: pip install --quiet --upgrade huggingface_hub

      # The Space keeps its own README.md (the YAML header HF reads) and
      # .gitattributes; everything else is replaced by the staged site, and
      # files the site no longer has are deleted.
      - name: Upload to the Space
        if: steps.token.outputs.present == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SPACE: kishormorol/SkillsAllYouNeed
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os, shutil
          from huggingface_hub import HfApi, hf_hub_download

          space = os.environ["SPACE"]
          for name in ("README.md", ".gitattributes"):
              shutil.copy(hf_hub_download(space, name, repo_type="space"), f"_hf/{name}")

          HfApi().upload_folder(
              repo_id=space,
              repo_type="space",
              folder_path="_hf",
              delete_patterns=["*"],
              commit_message=f"Sync from GitHub {os.environ['SOURCE_SHA'][:7]}",
          )
          PY
